# AutoDL A800x4 configuration for the current Stage-2B grounded-evidence run.
# The 50GB instance volume is /root/autodl-tmp. Before using this config, keep
# /data/wyx as a symlink to /root/autodl-tmp/wyx so migrated QA/latent provenance
# continues to resolve to the exact Stage-1 checkpoint path recorded in metadata.
# Hot model/QA/latent files and run outputs stay on the local instance volume.
# The original HDF5 is not required for Stage 2B and is intentionally not part
# of the minimum migration set.

storage:
  candidate_roots:
    - /root/autodl-tmp
    - /data
    - /autodl-pub/data
  # Threshold used by scripts/prepare_tensor_llm_assets.py. Also check `df -h /data/wyx`
  # before a formal run because the Stage-2 trainer does not enforce this storage value.
  min_free_gb: 8
  asset_root: /data/wyx/tensor_llm_assets
  hf_home: /data/wyx/hf_cache
  output_root: /data/wyx/tensor_llm_outputs

runtime:
  seed: 42
  device: auto

data:
  # Inactive for Stage 2B. Populate this local-volume path only when rebuilding QA/Stage 1.
  hdf5_path: /data/wyx/tensor_llm_assets/raw/2D_CFD_Turb_M0.1_Eta1e-08_Zeta1e-08_periodic_512_Train.hdf5
  fields:
    - Vx
  qa_dir: /data/wyx/tensor_llm_assets/tensor_readout_qa_vx
  latent_dir: /data/wyx/tensor_llm_assets/tensor_readout_latents_vx_2x

# Downstream QA over 16x16 patches encoded by the stage-1 alignment AE.
# Current stage-1 config encodes a per-patch z-score matrix; QA keeps raw mean/scale for reversible value queries.
# Set alignment_checkpoint to the latest successful alignment_best.pt before generation/training.
patch_qa:
  # Reuse the completed Qwen2.5-14B Layer-2 Stage-1 checkpoint; legacy metadata is validated by filename/payload.
  alignment_checkpoint: /data/wyx/tensor_llm_outputs/runs/20260722_160923_tensor_patch_text_alignment_qwen25_14b_spatial256_stage2_final/alignment_best.pt
  # Not read by Stage-2B training or scripts/build_tensor_patch_matched_qa.py.
  hdf5_path: /data/wyx/tensor_llm_assets/raw/2D_CFD_Turb_M0.1_Eta1e-08_Zeta1e-08_periodic_512_Train.hdf5
  # Use a fresh v3 directory so legacy/incomplete caches remain untouched and cannot be mixed in.
  qa_dir: /data/wyx/tensor_llm_assets/tensor_patch_qa_16_spatial256_14b_v3_direct
  # QA-only Stage-2B asset built from the immutable v3 records and stored FP16 latents.
  stage2b_qa_dir: /data/wyx/tensor_llm_assets/tensor_patch_qa_16_spatial256_14b_stage2b_matched_v1
  latent_dir: /data/wyx/tensor_llm_assets/tensor_patch_latents_16_spatial256_14b_v3_direct
  fields:
    - density
    - pressure
    - Vx
    - Vy
  # Reject silent four-field QA from a Vx-only stage-1 checkpoint. Enable only for an explicit transfer study.
  allow_unseen_alignment_fields: false
  patch_size: 16
  train_patches: 16384
  val_patches: 1024
  test_patches: 1024
  # Multiple natural-language queries over the same tensor teach question-conditioned readout.
  train_question_variants: 3
  val_question_variants: 2
  test_question_variants: 1
  sample_indices: all
  time_indices: all
  split_mode: sample
  tasks:
    - normalized_point_value
    - raw_point_value_with_stats
    - point_compare
    - region_mean_compare
    - extreme_quadrant
  region_size: 4
  # Numeric distractors differ by this amount in z space; raw-value spacing is this value times patch std.
  numeric_choice_spacing: 0.5
  stage2b_numeric_min_gap: 0.5
  stage2b_region_min_gap: 0.2
  stage2b_overwrite: false
  decimal_places: 6
  batch_size: 256
  device: auto
  storage_dtype: float16
  # Training labels are enough; do not persist oracle numeric values in formal QA files.
  include_oracle: false
  overwrite: false

compressor:
  config: null
  # The current Stage-2B path loads cached patch latents and does not use this legacy compressor.
  checkpoint: null

model:
  name_or_path: Qwen/Qwen2.5-14B-Instruct
  local_dir: /data/wyx/tensor_llm_assets/models/Qwen2.5-14B-Instruct
  revision: main
  trust_remote_code: false
  torch_dtype: bfloat16
  allow_patterns:
    - "*.json"
    - "*.safetensors"
    - "*.txt"
    - "*.model"
    - "*.py"
    - "tokenizer.*"
  ignore_patterns:
    - "*.h5"
    - "*.onnx"
    - "*.msgpack"

qa_generation:
  sample_indices: all
  time_indices: all
  max_states: 21000
  train_ratio: 0.7
  val_ratio: 0.15
  test_ratio: 0.15
  spatial_stride: 1
  num_bins: 10
  quantile_samples_per_state: 4096
  patch_size: 32
  point_bin_per_state: 15
  point_compare_per_state: 10
  patch_compare_per_state: 10
  max_quadrant_per_state: 0
  global_stat_bin_per_state: 0
  compare_min_bin_distance: 1
  compare_max_attempts: 32
  include_oracle: true

latent_export:
  splits:
    - train
    - val
    - test
  batch_size: 4
  device: auto
  spatial_stride: 1
  storage_dtype: float16
  allow_field_mismatch: false
  overwrite: false

patch_alignment:
  # Tensor-as-text alignment pretraining. The same PDEBench patch goes through:
  #   tensor path: patch -> value-preserving 16x16 latent -> spatial soft tokens -> frozen LLM
  #   text path: serialized patch -> frozen LLM
  # Probe mode reads matching shallow hidden states; alignment_transform selects the InfoNCE feature space.
  enabled: false  # Reserved for future pipeline orchestration; ignored when this script is called directly.
  run_name: tensor_patch_text_alignment_qwen25_14b_spatial256
  output_root: /data/wyx/tensor_llm_outputs/runs
  # Inactive unless Stage 1 is explicitly rerun after uploading the raw dataset.
  hdf5_path: /data/wyx/tensor_llm_assets/raw/2D_CFD_Turb_M0.1_Eta1e-08_Zeta1e-08_periodic_512_Train.hdf5
  fields:
    - density
    - pressure
    - Vx
    - Vy
  # channels: stack all fields into one [C,H,W] patch.
  # single: sample one field per record, so multiple fields enlarge the single-channel patch pool.
  field_sampling_mode: single
  patch_size: 16
  # Final Stage-2 initializer: maximize unique tensor coverage with only two passes over the data.
  train_records: 1048576
  val_records: 8192
  test_records: 8192
  sample_indices: all
  time_indices: all
  # sample: train/val/test use disjoint sample_index values. This is the default credibility check.
  # random_record: old behavior; all splits draw from the same sample/time pool.
  # time: disjoint time_index values; sample_time: both sample and time are disjoint.
  split_mode: sample
  split_train_ratio: 0.8
  split_val_ratio: 0.1
  split_test_ratio: 0.1
  # Avoid exact duplicate (sample,time,row,col) records within each split.
  unique_records: true
  # Fail if exact records overlap across train/val/test.
  ensure_disjoint_records: true
  seed: 42
  device: auto
  # Per-GPU batch; four GPUs provide 128 same-probe InfoNCE candidates per optimizer step.
  batch_size: 32
  eval_batch_size: 32
  epochs: 2
  lr: 1.0e-4
  weight_decay: 1.0e-4
  grad_clip_norm: 1.0
  # Two persistent readers per GPU overlap random HDF5 patch reads without overwhelming shared storage.
  num_workers: 2
  # Fail with stage diagnostics if a rank stops participating; normal long I/O should not hit this.
  distributed_timeout_seconds: 1800
  # Retained for bounded activation memory through the frozen teacher path.
  llm_gradient_checkpointing: true
  # patch_ae_config: build a patch-sized AE from patch_encoder below.
  # checkpoint: load compressor_checkpoint; use this for a trained patch AE or legacy 512x512 AE.
  encoder_source: patch_ae_config
  # true: train the AE when it is newly constructed. If freeze_patch_ae_after_pretrain is true,
  # this only affects the reconstruction warmup; the alignment phase trains only the configured adapter.
  # false: freeze a loaded checkpoint encoder and train only the alignment adapter.
  # To reuse a trained patch AE, set:
  #   encoder_source: checkpoint
  #   compressor_checkpoint: /path/to/alignment_best.pt or patch_ae_pretrain_best.pt
  #   train_patch_ae: false
  #   patch_ae_pretrain_epochs: 0
  train_patch_ae: true
  # Jointly refine the seven learned feature channels; the exact value channel remains immutable.
  freeze_patch_ae_after_pretrain: false
  # Jointly refine the AE without letting the contrastive objective erase reconstruction-relevant features.
  alignment_patch_ae_lr_scale: 0.1
  # Reconstruction-only warmup saves both best and last; alignment always starts from validation best.
  patch_ae_pretrain_epochs: 2
  # The 16x16 AE is much smaller than Qwen alignment. This keeps 2048 warmup updates per epoch
  # at train_records=1048576 on four GPUs while leaving the contrastive batch size unchanged.
  patch_ae_pretrain_batch_size: 128
  # Used only when encoder_source: checkpoint.
  compressor_checkpoint: null
  compressor_config: null
  # With patch_ae_config this should be false. Set true only when loading a checkpoint whose input_size
  # differs from patch_size, for example the legacy 512x512 compressor.
  resize_patch_to_compressor_input: false
  patch_encoder:
    normalization:
      # none disables normalization; zscore normalizes each sampled field patch independently.
      # When enabled, teacher_text_source must be normalized so both branches see identical values.
      mode: zscore
      scope: channel
      stats_path: null
      clip_min: null
      clip_max: null
    model:
      name: conv_token_autoencoder_2d
      input_size: [16, 16]
      base_channels: 32
      # No downsampling: latent position (r,c) remains tied to input position (r,c).
      channel_multipliers: []
      num_res_blocks: 1
      # 16*16*8 equals the old 4*4*128 latent scalar count, isolating topology from capacity.
      # Channel 0 is the exact normalized input value; channels 1..7 are learned local features.
      latent_dim: 8
      latent_grid: [16, 16]
      preserve_input_channels: true
      dropout: 0.0
      norm: group
      activation: gelu
      output_activation: identity
  # One data-dependent token per row-major latent position; there are no free learned queries.
  adapter_type: spatial_transformer
  adapter_dim: 512
  query_tokens: 256
  adapter_layers: 2
  adapter_heads: 8
  # Fixed unit-scale paths: optimization and legacy checkpoints cannot disable the 2D encoding
  # or the per-position latent residual used by both Stage 1 and Stage 2.
  # null maps spatial-adapter outputs directly to the LLM input embedding width.
  projection_dim: null
  # none: raw LLM hidden; projection: trainable CLIP-style heads; whitening: one fixed teacher-fitted
  # PCA transform shared by both branches. Whitening has no learned parameters and is not used by stage 2.
  alignment_transform:
    mode: whitening
    whitening:
      # Fit once on this many records from the training split before optimization.
      records: 2048
      # Keep the highest-variance teacher directions and discard unstable low-variance directions.
      dim: 512
      # Covariance shrinkage bounds amplification in retained directions.
      shrinkage: 0.01
      epsilon: 1.0e-5
      # Cap the regularized covariance condition number so low-variance numerical noise is not over-amplified.
      max_condition_number: 1000.0
  # CLIP-style readout space used only by the stage-1 contrastive objective and retrieval metrics.
  # Used only when alignment_transform.mode is projection. The spatial soft tokens still enter
  # Qwen at its native embedding width.
  alignment_projection:
    dim: 512
    hidden_dim: 1024
    # Keep this linear; a deeper head can memorize a private retrieval space.
    layers: 1
    dropout: 0.0
    # Separate maps let the text and soft-prefix branches compensate for their different input layouts.
    shared: false
  dropout: 0.0
  # Bound each soft prompt dimension with tanh before feeding it to the frozen LLM.
  # 0 disables the bound; 0.05 keeps token norms near ordinary input embeddings.
  soft_prompt_scale: 0.05
  temperature: 0.07
  # Absolute transformed-space alignment remains primary because deployment has no candidate-library mean.
  contrastive_loss_weight: 1.0
  # Keep i2t primary while giving t2i enough weight to penalize universal student-candidate hubs.
  contrastive_direction_weights:
    i2t: 0.6
    t2i: 0.4
  # Preserve the strong relative geometry without allowing centered retrieval to dominate optimization.
  centered_contrastive_loss_weight: 0.25
  # Stage 2 does not retain whitening, so native hidden geometry receives a stronger deployment constraint.
  native_centered_contrastive_loss_weight: 0.5
  # Counter the observed branch-mean drift that made one tensor candidate a t2i hub for most texts.
  mean_alignment_loss_weight: 0.5
  # Only contributes gradients while the AE is trainable; otherwise it is logged as a metric.
  reconstruction_loss_weight: 1.0
  # Serialize the same z-scored patch that enters the AE.
  teacher_text_source: normalized
  # Symmetric layout:
  #   teacher = configured raw/normalized tensor values + one batch-shared setting-specific suffix
  #   student = 256 continuous row-major spatial embeddings + the exact same suffix token IDs
  # No field names, task instructions, sample/time metadata, or patch-size text enter either branch.
  alignment_text_layout: values_shared_suffix
  # Select exactly one complete experiment: eos, representation, or probe. The formal run uses probe.
  alignment_anchor_mode: probe
  representation_suffix: "\nRepresentation:"
  # Stage 1 teaches access to tensor values; arithmetic is left to the frozen LLM's later layers.
  # The scalar result is never appended to either LLM input. It is computed internally only to exclude
  # quantized-equal answers from the InfoNCE negative set and to diagnose teacher semantics.
  # There are no answer words, class labels, LM-head CE, or teacher-logit distillation.
  # Every sample and DDP rank in a batch receives the same stem/coordinates, so InfoNCE cannot use prompt identity.
  probe_families:
    - point_value
  probe_region_size: 4
  # One semantic family avoids supervising arithmetic that the teacher fails, while eight concise
  # natural readout stems prevent Stage 1 from specializing to one fixed suffix wording.
  evaluation_probe_count: 8
  # Teacher/probe correlation is a warning-only diagnostic, never a training gate. Aggregate the
  # enabled family's wording templates over a larger independent sample.
  teacher_probe_warn_below_correlation: 0.1
  teacher_probe_diagnostic_records: 128
  # The active point-value stems are short; this cap catches accidental prompt growth.
  # Representation does not append EOS; eos mode consists of the tokenizer's explicit EOS token alone.
  max_shared_suffix_tokens: 32
  # Legacy prompt guard. In values_shared_suffix mode the suffix is tokenized separately and cannot be dropped.
  fail_on_text_anchor_missing: true
  # Fail if the numeric tensor body would be truncated before the separately preserved suffix.
  fail_on_text_max_length_hit: true
  # Also report retrieval over the full validation/test split, not only within each mini-batch.
  global_retrieval_eval: true
  global_retrieval_max_records: 8192
  global_retrieval_chunk_size: 1024
  # Used only with alignment_text_layout: legacy_prompt.
  text_prompt_template: compact
  # Three decimals preserve local differences while shortening the shallow teacher's numeric context.
  text_decimal_places: 3
  max_text_tokens: 3072
  # Number of training records checked before AE warmup to catch teacher text truncation early.
  text_preflight_records: 32
  # Layer 2 remains the validated Stage-1 target. The latest diagnostic isolates the old Stage-2
  # question cross-attention as the clear failure, so do not confound the direct-prefix experiment by
  # retraining Stage 1 with unvalidated trajectory targets. Optional shallow auxiliary supervision is
  # implemented and can be enabled later (for example [4, 6] with [0.25, 0.25]) if direct Stage-2
  # hidden-state diagnostics show that tensor sensitivity disappears after Layer 2.
  # Index 0 is rejected because it is the non-contextual input embedding at the readout token.
  teacher_layer: 2
  auxiliary_teacher_layers: []
  auxiliary_teacher_layer_weights: []
  # Read-only frozen-Qwen scan used before choosing teacher_layer. It never trains or loads the AE/Q-Former/projector.
  # Run scripts/scan_tensor_teacher_layers.py; --anchor-mode can override probe with eos or representation.
  layer_scan:
    split: val
    records: 64
    batch_size: 1
    # Optional confirmation scan of the shallow trajectory used by the 14B run.
    layers: "1,2,3,4,6,8,12"
    probe_count: 8
    # Probe mode compares an on-target perturbation with an equal-size off-target control perturbation.
    perturbation_scale: 0.01
    device: auto
  log_interval: 20

adapter:
  # Freeze the successful direct 256-token prefix and add a two-token factorized row/column
  # evidence reader. Qwen's native one-dimensional RoPE is unchanged.
  architecture: grounded_evidence_adapter
  # This must be byte-for-byte the same Stage-1 checkpoint used by patch_qa.
  init_checkpoint: /data/wyx/tensor_llm_outputs/runs/20260722_160923_tensor_patch_text_alignment_qwen25_14b_spatial256_stage2_final/alignment_best.pt
  # Warm-start the frozen global branch from the completed direct Stage-2 run.
  stage2_warm_start_checkpoint: /data/wyx/tensor_llm_outputs/runs/20260725_014234_tensor_patch_qa_direct_spatial_adapter_4gpu/adapter_best.pt
  # Small causal-reader experiment: continue from the latest grounded best checkpoint.
  # The later formal run should use the same parent independently, not the small-run child checkpoint.
  stage2b_resume_checkpoint: /data/wyx/tensor_llm_outputs/runs/20260726_043915_tensor_patch_qa_stage2b_grounded_evidence_autodl/adapter_best.pt
  soft_prompt_tokens: 256
  adapter_dim: 512
  adapter_layers: 2
  adapter_heads: 8
  dropout: 0.0
  latent_pos_encoding: grid
  question_conditioning: false
  question_condition_gate_init: 0.0
  # Formal runs must let the model read coordinates/tasks/statistics from text instead of regex-parsed features.
  structured_query_conditioning: false
  local_soft_prompt_tokens: 2
  local_adapter_layers: 1
  # Frozen Qwen contextual tokens remain the only question input; no parsed coordinates or task IDs are used.
  local_question_input_mode: contextual_tokens
  local_context_layer: 6
  # Fuse full token sequences from a shallow lexical layer and a middle contextual layer.
  local_context_layers: [2, 6]
  local_fusion_mode: grounded_role_routing
  local_text_encoder_layers: 0
  # Both evidence roles start hard-closed; a straight-through gate plus role-presence supervision
  # opens only required roles without RMSNorm undoing a soft magnitude gate.
  grounded_gate_bias_init: -2.0
  # Legacy residual-reader settings below are ignored by grounded_evidence_adapter and retained
  # only so the shared config can still be switched back to an older residual architecture.
  local_text_gate_init: 1.0
  local_text_gate_trainable: false
  local_gate_init: 1.0
  local_residual_gate_trainable: false
  zero_init_local_text_attention: true
  freeze_conditioned_backbone: true
  # The original stage-1 branch remains a fixed reference anchor.
  freeze_global_adapter: true
  global_unfreeze_epoch: 0
  # Retained for old hybrid checkpoints; unused while the residual reference is frozen.
  global_lr: 1.0e-5
  # Keep the frozen 256-token reference present in every formal Stage-2B forward.
  global_prompt_dropout: 0.0
  soft_prompt_scale: 0.05
  # Visibility is predicted from the natural-language-conditioned learned gate only.
  mask_inactive_local_tokens: true

llm_training:
  run_name: tensor_patch_qa_stage2b_causal_reader_small_autodl
  output_root: /data/wyx/tensor_llm_outputs/runs
  train_split: train
  val_split: val
  test_split: test
  # Deterministic complete-state subset (1600 states x 9 records) for the one required small run.
  max_train_records: 14400
  max_val_records: null
  max_test_records: null
  record_subset_mode: hash_state
  # A fixed 2000-record (200-state, two variants per task) validation slice audits continuation routing
  # before training. Epoch-end model selection still uses the complete validation split.
  initial_eval_records: 2000
  # Formal train/val/test splits must not share PDEBench sample_index values.
  require_disjoint_splits: true
  # Fail instead of silently truncating any natural-language instruction or query.
  require_untruncated_prompts: true
  prefer_record_latent_ref: false
  # Per-rank latent-cache budget shared across loader workers. Each [8,16,16] item is 8 KiB float32;
  # 8192 entries cap each rank near 64 MiB instead of multiplying the full budget by every worker.
  latent_cache_size: 8192
  # Two workers per rank overlap local-NVMe reads while avoiding 16 persistent dataset copies on four GPUs.
  num_workers: 2
  # Rank 0 performs the full latent/prompt audit and diagnostics while peer ranks wait in collectives.
  # Shared-storage stalls and the frozen 14B diagnostic forward can exceed PyTorch's default 30 minutes.
  distributed_timeout_seconds: 7200
  # DDP ranks load their full frozen-LLM replicas one at a time. This prevents four temporary CPU
  # checkpoint copies from peaking together before the weights are moved to their GPUs.
  serialize_llm_loading: true
  low_cpu_mem_usage: true
  # Linux MemAvailable includes reclaimable page cache. Abort coherently before host OOM makes SSH unresponsive.
  # Set to 0 only on a deliberately memory-constrained smoke-test host.
  min_host_memory_available_gib: 16
  device: auto
  torch_dtype: bfloat16
  shuffle_seed: 42
  # The continuation checkpoint already passed held-out routing/gate audits; this run spends its
  # single epoch on the answer objective. A fresh-reader run must restore one routing warmup epoch.
  epochs: 1
  grounding_routing_warmup_epochs: 0
  grounding_warmup_min_cell_top1: 0.99
  grounding_warmup_min_cell_top5: 0.99
  grounding_warmup_min_axis_top1: 0.99
  grounding_warmup_min_target_mass: 0.99
  grounding_warmup_min_gate_accuracy: 0.99
  # Tunable per-GPU microbatch. Each matched task unit has three records, so use 3, 6, 9, ...;
  # the grouped sampler packs that many complete units without splitting one across forwards.
  batch_size: 3
  # Evaluation is no-grad and uses one prompt-only forward for single-token choices; it can use the
  # measured training-safe batch without changing any metric or training gradient.
  eval_batch_size: 8
  eval_choice_batch_size: 4
  # Used only by the sequence-likelihood fallback; auto single-token scoring uses one forward directly.
  train_choice_batch_size: 12
  # Ranking and swapped-question losses are concatenated and chunked independently of the tunable outer batch.
  # This preserves every margin term when a forward contains multiple complete matched groups.
  train_grounding_batch_size: 8
  # Non-reentrant checkpointing retains gradients to the tensor prefix without storing every Qwen activation.
  llm_gradient_checkpointing: true
  # At the default, four torchrun ranks give an effective optimizer batch of 3 x 4 = 12.
  # In general: effective batch = batch_size x 4 ranks x gradient_accumulation_steps.
  # For a single-GPU fallback, pass --gradient-accumulation-steps 5.
  gradient_accumulation_steps: 1
  # Only the small grounded reader trains; Qwen and the direct global adapter remain frozen.
  lr: 5.0e-5
  lr_scheduler: cosine
  warmup_ratio: 0.03
  min_lr_ratio: 0.2
  weight_decay: 1.0e-4
  grad_clip_norm: 1.0
  ce_loss_weight: 0.02
  choice_ce_loss_weight: 1.0
  ranking_loss_weight: 0.0
  ranking_loss_margin: 0.1
  grounding_routing_loss_weight: 1.0
  # Keep routing as a low-weight generalization anchor after its dedicated warmup has converged.
  grounding_joint_routing_loss_weight: 0.1
  grounding_gate_loss_weight: 0.1
  matched_group_loss_weight: 0.2
  matched_group_loss_margin: 0.5
  # Compare the correct tensor prefix with a same-length zero-information prefix. A shuffled PDE tensor
  # is not a reliable negative: its answer can legitimately equal the current record's answer.
  ranking_loss_negative: no_latent
  # Small-run-only probe: swap local evidence within an audited matched coordinate group while
  # preserving the owner's frozen global prefix. Disable in the formal run if gain does not justify cost.
  swapped_question_loss_weight: 0.1
  swapped_question_loss_margin: 0.1
  # Same-label swaps are semantically ambiguous, especially for balanced binary tasks.
  swapped_question_require_different_answer: true
  # Per matched group, independent of the tunable outer microbatch size.
  swapped_question_max_records: 3
  prompt_template: task_specific
  max_prompt_tokens: 512
  max_target_tokens: 8
  append_eos: true
  # Keep epoch-end validation focused; the accepted formal run uses the full final baseline set on test.
  eval_baselines:
    - correct
    - zero_local
    - global_only
    - shuffled
  final_eval_baselines:
    - correct
    - zero_local
    - global_only
    - no_latent
    - zero_latent
    - shuffled
    - shuffled_stats
  choice_score: mean
  # The A/B/C/D labels are preflighted as unique single tokens; one forward supplies CE and matched margins.
  choice_scoring_mode: label
  # Group different natural-language questions for the same tensor and operation inside each batch.
  group_questions_by_state: true
  questions_per_state_group: 3
  # Select the weaker point task and require correct evidence to beat the same-length
  # zero-local control, frozen global-only branch, and same-query shuffled tensor.
  # Promote this recipe only when both point-task causal gains are positive and no
  # non-point validation task drops by more than 1 percentage point versus its parent.
  checkpoint_metric: point_value_min_causal_gain
  log_interval: 20
  # Preserve local curves even when W&B is unavailable on the training server.
  console_progress: false
  save_step_metrics: true
  # Model selection uses validation only; reserve test for the accepted formal configuration.
  evaluate_test: false
  diagnostics:
    enabled: true
    every_epochs: 1
    records_per_task: 4
    # JSON summaries retain all decision metrics; raw hidden snapshots previously cost ~1 GiB/run.
    save_states: false
    # Greedy free generation is diagnostic only; candidate NLL remains the formal accuracy metric.

# Final paper model: full-grid cross-attention into a frozen 14B LLM.
# Required: FIELD_TO_LLM_ROOT, FIELD_TO_LLM_ALIGNMENT_CHECKPOINT,
# and FIELD_TO_LLM_DIRECT_CHECKPOINT.

storage:
  hf_home: ${FIELD_TO_LLM_ROOT}/hf_cache
  output_root: ${FIELD_TO_LLM_ROOT}/runs

model:
  name_or_path: Qwen/Qwen2.5-14B-Instruct
  local_dir: null
  torch_dtype: bfloat16
  trust_remote_code: false
  gradient_checkpointing: true

data:
  qa_dir: ${FIELD_TO_LLM_ROOT}/data/matched_patch_qa
  latent_dir: ${FIELD_TO_LLM_ROOT}/data/patch_latents
  alignment_checkpoint: ${FIELD_TO_LLM_ALIGNMENT_CHECKPOINT}
  train_split: train
  val_split: val
  test_split: test
  max_train_records: null
  max_val_records: null
  max_test_records: null
  record_subset_mode: hash_state
  require_disjoint_splits: true
  prefer_record_latent_ref: false
  latent_cache_size: 8192
  num_workers: 2

memory:
  init_checkpoint: ${FIELD_TO_LLM_DIRECT_CHECKPOINT}
  freeze_spatial_backbone: true
  value_fourier_bands: 4
  value_hidden_dim: 128

cross_attention:
  layers_1based: [8, 20, 32]
  bridge_dim: 512
  heads: 8
  dropout: 0.0
  gate_init: 0.0

training:
  run_name: field_to_llm_cross_attention
  output_root: ${FIELD_TO_LLM_ROOT}/runs
  epochs: 2
  max_updates: 0
  batch_size: 3
  gradient_accumulation_steps: 1
  questions_per_state_group: 3
  lr: 5.0e-5
  gate_lr: 5.0e-4
  lr_scheduler: cosine
  warmup_ratio: 0.03
  min_lr_ratio: 0.2
  weight_decay: 1.0e-4
  grad_clip_norm: 1.0
  choice_ce_weight: 1.0
  full_answer_ce_weight: 0.02
  matched_group_weight: 0.1
  matched_group_margin: 0.5
  value_reconstruction_weight: 0.01
  prompt_template: task_specific
  max_prompt_tokens: 512
  max_target_tokens: 8
  append_eos: true
  log_interval: 20

evaluation:
  batch_size: 4
  screening_records: 2000
  screening_fractions: [0.125, 0.25, 0.50, 0.75, 1.0]
  selection_metric: macro_accuracy
  final_modes: [correct, no_tensor, zero_tensor, shuffled]
  evaluate_test: true

runtime:
  seed: 42
  shuffle_seed: 42
  device: auto
  distributed_timeout_seconds: 7200
  serialize_llm_loading: true
  low_cpu_mem_usage: true
  min_host_memory_available_gib: 16
  max_wall_clock_hours: 8.0
  final_eval_reserve_minutes: 70
  save_every_updates: 1000
  resume: null
  console_progress: true

experiment:
  name: tensor_editor_2d_mvp
  output_root: ./outputs/runs
  seed: 42
  device: auto

editor:
  data:
    jsonl_path: ./data/processed/tensor_editor_mvp/train.jsonl
    input_size: [512, 512]
    channels: 1
    validation_ratio: 0.1
    # Set true only when prompts were accidentally decoded as GBK/CP936 mojibake.
    fix_prompt_mojibake: false
    loader:
      batch_size: 1
      num_workers: 0
      pin_memory: true
      persistent_workers: false

  compressor:
    checkpoint_path: ./outputs/runs/<ae_run>/checkpoints/best.pt
    config_path: null
    freeze: true

  text:
    vocab_size: 8192
    embed_dim: 128
    hidden_dim: 128
    max_length: 160
    dropout: 0.05

  model:
    name: conditional_tensor_editor_2d
    # input_size / latent_grid / latent_dim are inherited from the AE checkpoint config.
    # The editor predicts delta_z on the AE latent map, then the frozen AE decoder renders y_hat.
    latent_hidden_dim: 256
    num_res_blocks: 2
    condition_dim: 256
    activation: gelu
    dropout: 0.05
    use_base_reconstruction: true
    residual_latent: true
    latent_delta_scale: 1.0
    zero_init_delta: true
    detach_latent_target: true

loss:
  name: composite_reconstruction_loss
  weights:
    mse: 1.0
    l1: 0.1
    relative_l1: 0.0
    gradient: 0.05
    latent_mse: 0.2
  eps: 1.0e-6

optimizer:
  name: adamw
  lr: 1.0e-4
  weight_decay: 1.0e-2

scheduler:
  name: cosine
  t_max: 20
  min_lr: 1.0e-6

training:
  epochs: 20
  mixed_precision: true
  grad_clip_norm: 1.0
  log_interval: 50
  num_saved_val_examples: 8

wandb:
  enabled: false
  api_key: null
  project: tensor-compression
  entity: null
  group: tensor-editor
  tags:
    - tensor-editor
    - latent-editor
    - 2d
  mode: offline
  log_model: false

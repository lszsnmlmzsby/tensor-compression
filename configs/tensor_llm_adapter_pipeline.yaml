# Template for the tensor-latent -> soft-prompt -> frozen-LLM pipeline.
# Copy this file to configs/local_tensor_llm_adapter_pipeline.yaml on the server
# and fill in machine-specific paths there. configs/local_*.yaml is gitignored.

storage:
  candidate_roots:
    - /data
    - /scratch
    - /mnt
    - /home
  min_free_gb: 100
  asset_root: /data/wyx/tensor_llm_assets
  hf_home: /data/wyx/hf_cache
  output_root: /data/wyx/tensor_llm_outputs

runtime:
  seed: 42
  device: auto

data:
  hdf5_path: /data/PiERN/PDEbench/data/2d-ns/2D_CFD_Turb_M0.1_Eta1e-08_Zeta1e-08_periodic_512_Train.hdf5
  fields:
    - Vx
  qa_dir: /data/wyx/tensor_llm_assets/tensor_readout_qa_vx
  latent_dir: /data/wyx/tensor_llm_assets/tensor_readout_latents_vx_2x

# Downstream QA over 16x16 patches encoded by the stage-1 alignment AE.
# Current stage-1 config encodes a per-patch z-score matrix; QA keeps raw mean/scale for reversible value queries.
# Set alignment_checkpoint to the latest successful alignment_best.pt before generation/training.
patch_qa:
  # Fill this with the completed Qwen2.5-32B Stage-1 alignment_best.pt before Stage 2.
  alignment_checkpoint: null
  hdf5_path: /data/PiERN/PDEbench/data/2d-ns/2D_CFD_Turb_M0.1_Eta1e-08_Zeta1e-08_periodic_512_Train.hdf5
  qa_dir: /data/wyx/tensor_llm_assets/tensor_patch_qa_16
  latent_dir: /data/wyx/tensor_llm_assets/tensor_patch_latents_16
  fields:
    - density
    - pressure
    - Vx
    - Vy
  # Reject silent four-field QA from a Vx-only stage-1 checkpoint. Enable only for an explicit transfer study.
  allow_unseen_alignment_fields: false
  patch_size: 16
  train_patches: 16384
  val_patches: 1024
  test_patches: 1024
  # Multiple natural-language queries over the same tensor teach question-conditioned readout.
  train_question_variants: 3
  val_question_variants: 2
  test_question_variants: 1
  sample_indices: all
  time_indices: all
  split_mode: sample
  tasks:
    - normalized_point_value
    - raw_point_value_with_stats
    - point_compare
    - region_mean_compare
    - extreme_quadrant
  region_size: 4
  # Numeric distractors differ by this amount in z space; raw-value spacing is this value times patch std.
  numeric_choice_spacing: 0.5
  decimal_places: 6
  batch_size: 256
  device: auto
  storage_dtype: float16
  # Training labels are enough; do not persist oracle numeric values in formal QA files.
  include_oracle: false
  overwrite: false

compressor:
  config: null
  checkpoint: /home/lpr/wyx/tensor-compression/outputs/runs/20260620_153406_compressor_2d_baseline/checkpoints/best.pt

model:
  name_or_path: Qwen/Qwen2.5-32B-Instruct
  local_dir: /data/wyx/tensor_llm_assets/models/Qwen2.5-32B-Instruct
  revision: main
  trust_remote_code: false
  torch_dtype: bfloat16
  allow_patterns:
    - "*.json"
    - "*.safetensors"
    - "*.txt"
    - "*.model"
    - "*.py"
    - "tokenizer.*"
  ignore_patterns:
    - "*.h5"
    - "*.onnx"
    - "*.msgpack"

qa_generation:
  sample_indices: all
  time_indices: all
  max_states: 21000
  train_ratio: 0.7
  val_ratio: 0.15
  test_ratio: 0.15
  spatial_stride: 1
  num_bins: 10
  quantile_samples_per_state: 4096
  patch_size: 32
  point_bin_per_state: 15
  point_compare_per_state: 10
  patch_compare_per_state: 10
  max_quadrant_per_state: 0
  global_stat_bin_per_state: 0
  compare_min_bin_distance: 1
  compare_max_attempts: 32
  include_oracle: true

latent_export:
  splits:
    - train
    - val
    - test
  batch_size: 4
  device: auto
  spatial_stride: 1
  storage_dtype: float16
  allow_field_mismatch: false
  overwrite: false

patch_alignment:
  # Tensor-as-text alignment pretraining. The same PDEBench patch goes through:
  #   tensor path: patch -> patch AE encoder -> Q-Former soft prompt -> frozen LLM
  #   text path: serialized patch -> frozen LLM
  # Probe mode reads matching shallow hidden states; alignment_transform selects the InfoNCE feature space.
  enabled: false  # Reserved for future pipeline orchestration; ignored when this script is called directly.
  run_name: tensor_patch_text_alignment_qwen25_32b_layer56_point_value
  output_root: /data/wyx/tensor_llm_outputs/runs
  hdf5_path: /data/PiERN/PDEbench/data/2d-ns/2D_CFD_Turb_M0.1_Eta1e-08_Zeta1e-08_periodic_512_Train.hdf5
  fields:
    - density
    - pressure
    - Vx
    - Vy
  # channels: stack all fields into one [C,H,W] patch.
  # single: sample one field per record, so multiple fields enlarge the single-channel patch pool.
  field_sampling_mode: single
  patch_size: 16
  # Layer 56 is much more expensive than the Layer-2 diagnostic. Use a 1k validation library
  # for checkpoint selection, then retain a 4k held-out test library for the formal final metric.
  train_records: 32768
  val_records: 1024
  test_records: 4096
  sample_indices: all
  time_indices: all
  # sample: train/val/test use disjoint sample_index values. This is the default credibility check.
  # random_record: old behavior; all splits draw from the same sample/time pool.
  # time: disjoint time_index values; sample_time: both sample and time are disjoint.
  split_mode: sample
  split_train_ratio: 0.8
  split_val_ratio: 0.1
  split_test_ratio: 0.1
  # Avoid exact duplicate (sample,time,row,col) records within each split.
  unique_records: true
  # Fail if exact records overlap across train/val/test.
  ensure_disjoint_records: true
  seed: 42
  device: auto
  # Conservative per-GPU start for a truncated 32B teacher. Raise this after the smoke test;
  # gradient accumulation does not add InfoNCE negatives.
  batch_size: 4
  eval_batch_size: 2
  epochs: 2
  lr: 1.0e-4
  weight_decay: 1.0e-4
  grad_clip_norm: 1.0
  num_workers: 0
  # Fail with stage diagnostics if a rank stops participating; normal long I/O should not hit this.
  distributed_timeout_seconds: 1800
  # Required for backpropagating soft-prefix gradients through 56 frozen 32B transformer blocks.
  llm_gradient_checkpointing: true
  # patch_ae_config: build a patch-sized AE from patch_encoder below.
  # checkpoint: load compressor_checkpoint; use this for a trained patch AE or legacy 512x512 AE.
  encoder_source: checkpoint
  # true: train the AE when it is newly constructed. If freeze_patch_ae_after_pretrain is true,
  # this only affects the reconstruction warmup; the alignment phase trains only the Q-Former bridge.
  # false: freeze a loaded checkpoint encoder and train only the alignment adapter.
  # To reuse a trained patch AE, set:
  #   encoder_source: checkpoint
  #   compressor_checkpoint: /path/to/alignment_best.pt or patch_ae_pretrain_best.pt
  #   train_patch_ae: false
  #   patch_ae_pretrain_epochs: 0
  train_patch_ae: false
  # Reuse only the reconstruction AE from the successful 32B Layer-2 warmup; loader ignores its old Q-Former.
  freeze_patch_ae_after_pretrain: true
  # Jointly refine the AE without letting the contrastive objective erase reconstruction-relevant features.
  alignment_patch_ae_lr_scale: 0.1
  # Reconstruction-only warmup saves both best and last; alignment always starts from validation best.
  patch_ae_pretrain_epochs: 0
  # Used only when encoder_source: checkpoint.
  compressor_checkpoint: /data/wyx/tensor_llm_outputs/runs/20260719_225204_tensor_patch_text_alignment_qwen25_32b_point_value/patch_ae_pretrain_best.pt
  compressor_config: null
  # With patch_ae_config this should be false. Set true only when loading a checkpoint whose input_size
  # differs from patch_size, for example the legacy 512x512 compressor.
  resize_patch_to_compressor_input: false
  patch_encoder:
    normalization:
      # none disables normalization; zscore normalizes each sampled field patch independently.
      # When enabled, teacher_text_source must be normalized so both branches see identical values.
      mode: zscore
      scope: channel
      stats_path: null
      clip_min: null
      clip_max: null
    model:
      name: conv_token_autoencoder_2d
      input_size: [16, 16]
      base_channels: 32
      channel_multipliers: [1, 2]
      num_res_blocks: 1
      latent_dim: 128
      latent_grid: [4, 4]
      dropout: 0.0
      norm: group
      activation: gelu
      output_activation: identity
  adapter_type: qformer
  adapter_dim: 512
  query_tokens: 16
  adapter_layers: 4
  adapter_heads: 8
  # null maps Q-Former outputs directly to the LLM input embedding width.
  projection_dim: null
  # none: raw LLM hidden; projection: trainable CLIP-style heads; whitening: one fixed teacher-fitted
  # PCA transform shared by both branches. Whitening has no learned parameters and is not used by stage 2.
  alignment_transform:
    mode: whitening
    whitening:
      # Fit once on this many records from the training split before optimization.
      records: 2048
      # Keep the highest-variance teacher directions and discard unstable low-variance directions.
      dim: 512
      # Covariance shrinkage bounds amplification in retained directions.
      shrinkage: 0.01
      epsilon: 1.0e-5
      # Cap the regularized covariance condition number so low-variance numerical noise is not over-amplified.
      max_condition_number: 1000.0
  # CLIP-style readout space used only by the stage-1 contrastive objective and retrieval metrics.
  # Used only when alignment_transform.mode is projection. The Q-Former soft tokens still enter
  # Qwen at its native embedding width.
  alignment_projection:
    dim: 512
    hidden_dim: 1024
    # Keep this linear; a deeper head can memorize a private retrieval space.
    layers: 1
    dropout: 0.0
    # Separate maps let the text and soft-prefix branches compensate for their different input layouts.
    shared: false
  dropout: 0.0
  # Bound each soft prompt dimension with tanh before feeding it to the frozen LLM.
  # 0 disables the bound; 0.05 keeps token norms near ordinary input embeddings.
  soft_prompt_scale: 0.05
  temperature: 0.07
  # Uncentered retrieval remains an auxiliary absolute-space constraint, but no longer dominates the
  # probe-conditioned common direction that caused t2i candidate hubs.
  contrastive_loss_weight: 0.25
  # Deployment is tensor -> text, so i2t is primary. Keep t2i as an auxiliary one-to-one/hubness
  # regularizer; these values are normalized by the loss implementation.
  contrastive_direction_weights:
    i2t: 0.75
    t2i: 0.25
  # The primary residual objective uses one DDP-global mean over the current same-probe global batch.
  centered_contrastive_loss_weight: 1.0
  # Preserve the same discriminative residual geometry in Qwen's native hidden space for stage 2.
  native_centered_contrastive_loss_weight: 0.25
  # Match transformed and native branch means during training so centering is not required at inference.
  mean_alignment_loss_weight: 0.1
  # Only contributes gradients while the AE is trainable; otherwise it is logged as a metric.
  reconstruction_loss_weight: 1.0
  # Serialize the same z-scored patch that enters the AE.
  teacher_text_source: normalized
  # Symmetric layout:
  #   teacher = configured raw/normalized tensor values + one batch-shared setting-specific suffix
  #   student = 16 continuous Q-Former embeddings + the exact same suffix token IDs
  # No field names, task instructions, sample/time metadata, or patch-size text enter either branch.
  alignment_text_layout: values_shared_suffix
  # Select exactly one complete experiment: eos, representation, or probe. The formal run uses probe.
  alignment_anchor_mode: probe
  representation_suffix: "\nRepresentation:"
  # Stage 1 teaches access to tensor values; arithmetic is left to the frozen LLM's later layers.
  # The scalar result is never appended to either LLM input. It is computed internally only to exclude
  # quantized-equal answers from the InfoNCE negative set and to diagnose teacher semantics.
  # There are no answer words, class labels, LM-head CE, or teacher-logit distillation.
  # Every sample and DDP rank in a batch receives the same stem/coordinates, so InfoNCE cannot use prompt identity.
  probe_families:
    - point_value
  probe_region_size: 4
  # One semantic family avoids supervising arithmetic that the teacher fails, while eight concise
  # natural readout stems prevent Stage 1 from specializing to one fixed suffix wording.
  evaluation_probe_count: 8
  # Teacher/probe correlation is a warning-only diagnostic, never a training gate. Aggregate the
  # enabled family's wording templates over a larger independent sample.
  teacher_probe_warn_below_correlation: 0.1
  teacher_probe_diagnostic_records: 128
  # The active point-value stems are short; this cap catches accidental prompt growth.
  # Representation does not append EOS; eos mode consists of the tokenizer's explicit EOS token alone.
  max_shared_suffix_tokens: 32
  # Legacy prompt guard. In values_shared_suffix mode the suffix is tokenized separately and cannot be dropped.
  fail_on_text_anchor_missing: true
  # Fail if the numeric tensor body would be truncated before the separately preserved suffix.
  fail_on_text_max_length_hit: true
  # Also report retrieval over the full validation/test split, not only within each mini-batch.
  global_retrieval_eval: true
  global_retrieval_max_records: 8192
  global_retrieval_chunk_size: 1024
  # Used only with alignment_text_layout: legacy_prompt.
  text_prompt_template: compact
  # Three decimals preserve local differences while shortening the shallow teacher's numeric context.
  text_decimal_places: 3
  max_text_tokens: 3072
  # Number of training records checked before AE warmup to catch teacher text truncation early.
  text_preflight_records: 32
  # The 32B scan first shows clear probe-location selectivity in the late layers; Layer 56 has the
  # strongest observed target/control response (1.81) while retaining more rank than Layer 64.
  # Index 0 is rejected because it is the non-contextual input embedding at the readout token.
  teacher_layer: 56
  # Read-only frozen-Qwen scan used before choosing teacher_layer. It never trains or loads the AE/Q-Former/projector.
  # Run scripts/scan_tensor_teacher_layers.py; --anchor-mode can override probe with eos or representation.
  layer_scan:
    split: val
    records: 64
    batch_size: 1
    # Optional confirmation scan around the selected late-layer region.
    layers: "48,52,54,56,58,60,64"
    probe_count: 8
    # Probe mode compares an on-target perturbation with an equal-size off-target control perturbation.
    perturbation_scale: 0.01
    device: auto
  log_interval: 20

adapter:
  # Clone the stage-1 Q-Former into a question-conditioned residual branch; do not reuse downstream QA weights.
  architecture: residual_question_qformer
  # Fill this with the same Qwen2.5-32B Stage-1 checkpoint used by patch_qa.
  init_checkpoint: null
  soft_prompt_tokens: 16
  adapter_dim: 512
  adapter_layers: 4
  adapter_heads: 8
  dropout: 0.0
  latent_pos_encoding: grid
  question_conditioning: true
  question_condition_gate_init: 0.0
  # Formal runs must let the model read coordinates/tasks/statistics from text instead of regex-parsed features.
  structured_query_conditioning: false
  # Residual mode keeps the same 16 token positions and inherited four Q-Former layers as stage 1.
  local_soft_prompt_tokens: 16
  local_adapter_layers: 4
  # Frozen Qwen contextual tokens remain the only question input; no parsed coordinates or task IDs are used.
  local_question_input_mode: contextual_tokens
  local_context_layer: 6
  # Fuse full token sequences from a shallow lexical layer and a middle contextual layer.
  local_context_layers: [2, 6]
  local_fusion_mode: residual_qformer
  local_text_encoder_layers: 0
  # Keep both new text conditioning and the final residual small at initialization.
  local_text_gate_init: 0.05
  local_gate_init: 0.1
  # The original stage-1 branch remains a fixed anchor; its cloned conditioned branch is trainable.
  freeze_global_adapter: true
  global_unfreeze_epoch: 0
  # Retained for old hybrid checkpoints; unused while the residual reference is frozen.
  global_lr: 1.0e-5
  # Dropping the base would leave only a small residual; question grounding is enforced by swap loss instead.
  global_prompt_dropout: 0.0
  soft_prompt_scale: 0.05

llm_training:
  run_name: tensor_patch_qa_residual_question_qformer
  output_root: /data/wyx/tensor_llm_outputs/runs
  train_split: train
  val_split: val
  test_split: test
  max_train_records: null
  max_val_records: null
  max_test_records: null
  # Evaluate transfer before QA fine-tuning on this many validation questions.
  initial_eval_records: 512
  # Formal train/val/test splits must not share PDEBench sample_index values.
  require_disjoint_splits: true
  # Fail instead of silently truncating any natural-language instruction or query.
  require_untruncated_prompts: true
  prefer_record_latent_ref: false
  device: auto
  torch_dtype: bfloat16
  shuffle_seed: 42
  # 245,760 records x 2 epochs is 1.5x the previous two-epoch exposure and targets about 10 hours on one A800.
  epochs: 2
  # Five same-tensor groups of three fit exactly; 245,760 / 15 = 16,384 optimizer steps per epoch.
  batch_size: 15
  eval_batch_size: 2
  eval_choice_batch_size: 16
  gradient_accumulation_steps: 1
  lr: 1.0e-4
  lr_scheduler: cosine
  warmup_ratio: 0.03
  min_lr_ratio: 0.1
  weight_decay: 1.0e-4
  grad_clip_norm: 1.0
  ce_loss_weight: 0.05
  choice_ce_loss_weight: 1.0
  ranking_loss_weight: 0.1
  ranking_loss_margin: 0.1
  ranking_loss_negative: shuffled
  # For the same tensor/task, its own question-conditioned prompt must beat another question's prompt.
  swapped_question_loss_weight: 0.1
  swapped_question_loss_margin: 0.1
  # Bound the extra frozen-LLM scoring graph so batch_size 15 remains practical on one 80GB GPU.
  swapped_question_max_records: 8
  prompt_template: task_specific
  max_prompt_tokens: 512
  max_target_tokens: 8
  append_eos: true
  # Keep per-epoch evaluation cheap; run the full baseline set once on the final best checkpoint.
  eval_baselines:
    - correct
    - shuffled
  final_eval_baselines:
    - correct
    - global_only
    - local_only
    - no_latent
    - zero_latent
    - shuffled
    - shuffled_stats
  choice_score: mean
  # Group different natural-language questions for the same tensor and operation inside each batch.
  group_questions_by_state: true
  questions_per_state_group: 3
  # Prevent the easy quadrant task from dominating checkpoint selection.
  checkpoint_metric: macro_latent_gain
  log_interval: 20
  # W&B retains step curves; the terminal and metrics JSON stay compact by default.
  console_progress: false
  save_step_metrics: false
  diagnostics:
    enabled: true
    every_epochs: 1
    records_per_task: 4
    # Greedy free generation is diagnostic only; candidate NLL remains the formal accuracy metric.
    generation_max_new_tokens: 8
    layers: [0, 2, 8, 14, -1]

wandb:
  enabled: true
  api_key: null
  project: tensor-compression
  entity: null
  group: adapter
  tags:
    - adapter
    - tensor-llm
    - soft-prompt
    - patch-alignment
  mode: online
  log_model: false
  # false logs compact core/task curves; complete field/baseline/diagnostic matrices stay in local JSON files.
  detailed_metrics: false

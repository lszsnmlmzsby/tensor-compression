# Template for the tensor-latent -> soft-prompt -> frozen-LLM pipeline.
# Copy this file to configs/local_tensor_llm_adapter_pipeline.yaml on the server
# and fill in machine-specific paths there. configs/local_*.yaml is gitignored.

storage:
  candidate_roots:
    - /data
    - /scratch
    - /mnt
    - /home
  min_free_gb: 100
  asset_root: /data/wyx/tensor_llm_assets
  hf_home: /data/wyx/hf_cache
  output_root: /data/wyx/tensor_llm_outputs

runtime:
  seed: 42
  device: auto

data:
  hdf5_path: /data/PiERN/PDEbench/data/2d-ns/2D_CFD_Turb_M0.1_Eta1e-08_Zeta1e-08_periodic_512_Train.hdf5
  fields:
    - Vx
  qa_dir: /data/wyx/tensor_llm_assets/tensor_readout_qa_vx
  latent_dir: /data/wyx/tensor_llm_assets/tensor_readout_latents_vx_2x

# Downstream QA over the normalized 16x16 patches used by patch alignment.
# Set alignment_checkpoint to the latest successful alignment_best.pt before generation/training.
patch_qa:
  alignment_checkpoint: /data/wyx/tensor_llm_outputs/runs/20260711_171257_tensor_patch_text_alignment/alignment_best.pt
  hdf5_path: /data/PiERN/PDEbench/data/2d-ns/2D_CFD_Turb_M0.1_Eta1e-08_Zeta1e-08_periodic_512_Train.hdf5
  qa_dir: /data/wyx/tensor_llm_assets/tensor_patch_qa_16
  latent_dir: /data/wyx/tensor_llm_assets/tensor_patch_latents_16
  fields:
    - density
    - pressure
    - Vx
    - Vy
  patch_size: 16
  train_patches: 16384
  val_patches: 1024
  test_patches: 1024
  # Multiple natural-language queries over the same tensor teach question-conditioned readout.
  train_question_variants: 2
  val_question_variants: 2
  test_question_variants: 1
  sample_indices: all
  time_indices: all
  split_mode: sample
  tasks:
    - normalized_point_value
    - raw_point_value_with_stats
    - point_compare
    - region_mean_compare
    - extreme_quadrant
  region_size: 4
  # Numeric distractors differ by this amount in z space; raw-value spacing is this value times patch std.
  numeric_choice_spacing: 0.5
  decimal_places: 6
  batch_size: 256
  device: auto
  storage_dtype: float16
  # Training labels are enough; do not persist oracle numeric values in formal QA files.
  include_oracle: false
  overwrite: false

compressor:
  config: null
  checkpoint: /home/lpr/wyx/tensor-compression/outputs/runs/20260620_153406_compressor_2d_baseline/checkpoints/best.pt

model:
  name_or_path: Qwen/Qwen2.5-1.5B-Instruct
  local_dir: null
  revision: main
  trust_remote_code: false
  torch_dtype: bfloat16
  allow_patterns:
    - "*.json"
    - "*.safetensors"
    - "*.txt"
    - "*.model"
    - "*.py"
    - "tokenizer.*"
  ignore_patterns:
    - "*.h5"
    - "*.onnx"
    - "*.msgpack"

qa_generation:
  sample_indices: all
  time_indices: all
  max_states: 21000
  train_ratio: 0.7
  val_ratio: 0.15
  test_ratio: 0.15
  spatial_stride: 1
  num_bins: 10
  quantile_samples_per_state: 4096
  patch_size: 32
  point_bin_per_state: 15
  point_compare_per_state: 10
  patch_compare_per_state: 10
  max_quadrant_per_state: 0
  global_stat_bin_per_state: 0
  compare_min_bin_distance: 1
  compare_max_attempts: 32
  include_oracle: true

latent_export:
  splits:
    - train
    - val
    - test
  batch_size: 4
  device: auto
  spatial_stride: 1
  storage_dtype: float16
  allow_field_mismatch: false
  overwrite: false

patch_alignment:
  # Tensor-as-text alignment pretraining. The same PDEBench patch goes through:
  #   tensor path: patch -> patch AE encoder -> Q-Former soft prompt -> frozen LLM hidden state
  #   text path: serialized patch -> frozen LLM middle hidden state -> vector
  # and the two vectors are trained with contrastive/cosine losses.
  enabled: false  # Reserved for future pipeline orchestration; ignored when this script is called directly.
  run_name: tensor_patch_text_alignment_vx
  output_root: /data/wyx/tensor_llm_outputs/runs
  hdf5_path: /data/PiERN/PDEbench/data/2d-ns/2D_CFD_Turb_M0.1_Eta1e-08_Zeta1e-08_periodic_512_Train.hdf5
  fields:
    - density
    - pressure
    - Vx
    - Vy
  # channels: stack all fields into one [C,H,W] patch.
  # single: sample one field per record, so multiple fields enlarge the single-channel patch pool.
  field_sampling_mode: single
  patch_size: 16
  # Number of random patch records created in-memory per split after applying split_mode.
  train_records: 262144
  val_records: 8192
  test_records: 8192
  sample_indices: all
  time_indices: all
  # sample: train/val/test use disjoint sample_index values. This is the default credibility check.
  # random_record: old behavior; all splits draw from the same sample/time pool.
  # time: disjoint time_index values; sample_time: both sample and time are disjoint.
  split_mode: sample
  split_train_ratio: 0.8
  split_val_ratio: 0.1
  split_test_ratio: 0.1
  # Avoid exact duplicate (sample,time,row,col) records within each split.
  unique_records: true
  # Fail if exact records overlap across train/val/test.
  ensure_disjoint_records: true
  seed: 42
  device: auto
  batch_size: 32
  eval_batch_size: 32
  epochs: 4
  lr: 1.0e-4
  weight_decay: 1.0e-4
  grad_clip_norm: 1.0
  num_workers: 0
  # patch_ae_config: build a patch-sized AE from patch_encoder below.
  # checkpoint: load compressor_checkpoint; use this for a trained patch AE or legacy 512x512 AE.
  encoder_source: patch_ae_config
  # true: update AE encoder during alignment. For a fresh patch AE this should stay true.
  # false: freeze a loaded checkpoint encoder and train only the alignment adapter.
  # To reuse a trained patch AE, set:
  #   encoder_source: checkpoint
  #   compressor_checkpoint: /path/to/alignment_best.pt or patch_ae_pretrain_last.pt
  #   train_patch_ae: false
  #   patch_ae_pretrain_epochs: 0
  train_patch_ae: true
  # true: after reconstruction pretraining, freeze patch AE and train only the Q-Former/soft prompt bridge.
  freeze_patch_ae_after_pretrain: false
  # Reconstruction-only warmup for a fresh patch AE before contrastive alignment starts.
  patch_ae_pretrain_epochs: 5
  # Used only when encoder_source: checkpoint.
  compressor_checkpoint: null
  compressor_config: null
  # With patch_ae_config this should be false. Set true only when loading a checkpoint whose input_size
  # differs from patch_size, for example the legacy 512x512 compressor.
  resize_patch_to_compressor_input: false
  patch_encoder:
    normalization:
      mode: zscore
      scope: channel
      stats_path: null
      clip_min: null
      clip_max: null
    model:
      name: conv_token_autoencoder_2d
      input_size: [16, 16]
      base_channels: 32
      channel_multipliers: [1, 2]
      num_res_blocks: 1
      latent_dim: 128
      latent_grid: [4, 4]
      dropout: 0.0
      norm: group
      activation: gelu
      output_activation: identity
  adapter_type: qformer
  adapter_dim: 512
  query_tokens: 16
  adapter_layers: 4
  adapter_heads: 8
  # null means directly align to the LLM hidden size. This keeps the text teacher side fixed.
  projection_dim: null
  # Optional CLIP-style alignment space on top of frozen LLM hidden states.
  # The LLM still receives tensor soft prompts; this only changes the contrastive loss/eval space.
  alignment_projection:
    enabled: true
    # Keep this lower than the LLM hidden size to avoid a high-capacity private matching space.
    dim: 512
    # Used only when layers > 1.
    hidden_dim: 1024
    # 1 = LayerNorm + Linear. Increase only as an ablation.
    layers: 1
    dropout: 0.0
    # false gives student/teacher separate linear maps; true forces the same map on both branches.
    shared: false
  dropout: 0.0
  # Bound each soft prompt dimension with tanh before feeding it to the frozen LLM.
  # 0 disables the bound; 0.05 keeps token norms near ordinary input embeddings.
  soft_prompt_scale: 0.05
  temperature: 0.07
  # Main objective. With center_embeddings: false this optimizes globally comparable embeddings.
  contrastive_loss_weight: 1.0
  # Optional auxiliary batch-centered InfoNCE. Keep small; it is a stabilizer, not the success metric.
  centered_contrastive_loss_weight: 0.1
  # Keep this at 0 for now: raw cosine can reward shared hidden-space directions without improving retrieval.
  cosine_loss_weight: 0.0
  # Only contributes gradients when train_patch_ae is true; otherwise it is logged as a metric.
  reconstruction_loss_weight: 1.0
  # normalized: serialize exactly the normalized/resized patch that enters the AE.
  # raw: serialize the original HDF5 values; useful only as an ablation.
  teacher_text_source: normalized
  # false: main loss uses raw L2-normalized embeddings, so retrieval is globally comparable.
  # true recreates the earlier batch-centered objective and should be used only as an ablation.
  center_embeddings: false
  # true: fail immediately if tokenization/truncation drops the Representation anchor.
  fail_on_text_anchor_missing: true
  # true: fail when a serialized text sequence reaches max_text_tokens, because truncation is then ambiguous.
  fail_on_text_max_length_hit: true
  # Also report retrieval over the full validation/test split, not only within each mini-batch.
  global_retrieval_eval: true
  global_retrieval_max_records: 8192
  global_retrieval_chunk_size: 1024
  # compact excludes sample/time/top_left metadata because tensor path cannot observe them.
  # compact_with_metadata keeps the previous metadata-rich prompt only for ablation.
  text_prompt_template: compact
  text_decimal_places: 2
  max_text_tokens: 2048
  # Number of training records checked before AE warmup to catch teacher text truncation early.
  text_preflight_records: 32
  # Qwen2.5-1.5B has 28 decoder layers; lower-middle layers are usually easier for input-level soft prompts.
  teacher_layer: 2
  log_interval: 20

adapter:
  # Start from stage-1 tensor/text alignment; do not reuse downstream QA-fitted parameters.
  architecture: hybrid_local_qformer
  init_checkpoint: /data/wyx/tensor_llm_outputs/runs/20260711_171257_tensor_patch_text_alignment/alignment_best.pt
  soft_prompt_tokens: 16
  adapter_dim: 512
  adapter_layers: 4
  adapter_heads: 8
  dropout: 0.0
  latent_pos_encoding: grid
  question_conditioning: true
  question_condition_gate_init: 0.0
  # Formal runs must let the model read coordinates/tasks/statistics from text instead of regex-parsed features.
  structured_query_conditioning: false
  local_soft_prompt_tokens: 8
  local_adapter_layers: 2
  # Frozen Qwen contextual tokens remain the only question input; no parsed coordinates or task IDs are used.
  local_question_input_mode: contextual_tokens
  local_context_layer: 6
  # Condition learned queries with a causal last-token anchor, then attend text and latent in each block.
  local_fusion_mode: anchor_queries
  local_text_encoder_layers: 0
  # The previous 0.1 gate left the local branch much weaker than the global branch.
  local_gate_init: 0.5
  # Freeze the stage-1 global branch for epoch 1, then fine-tune it from epoch 2.
  freeze_global_adapter: true
  global_unfreeze_epoch: 2
  # Use one tenth of the local branch LR after unfreezing.
  global_lr: 1.0e-5
  # On a fraction of training batches, remove global prompts so local prompts cannot be bypassed.
  global_prompt_dropout: 0.25
  soft_prompt_scale: 0.05

llm_training:
  run_name: tensor_patch_qa_anchor_conditioned_qformer
  output_root: /data/wyx/tensor_llm_outputs/runs
  train_split: train
  val_split: val
  test_split: test
  max_train_records: null
  max_val_records: null
  max_test_records: null
  # Evaluate transfer before QA fine-tuning on this many validation questions.
  initial_eval_records: 512
  # Formal train/val/test splits must not share PDEBench sample_index values.
  require_disjoint_splits: true
  # Fail instead of silently truncating any natural-language instruction or query.
  require_untruncated_prompts: true
  prefer_record_latent_ref: false
  device: auto
  torch_dtype: bfloat16
  shuffle_seed: 42
  # 163,840 training QA records x 5 epochs matches the previous 40,960 x 20 exposure budget.
  epochs: 5
  batch_size: 16
  eval_batch_size: 2
  eval_choice_batch_size: 16
  gradient_accumulation_steps: 1
  lr: 1.0e-4
  lr_scheduler: cosine
  warmup_ratio: 0.03
  min_lr_ratio: 0.1
  weight_decay: 1.0e-4
  grad_clip_norm: 1.0
  ce_loss_weight: 0.05
  choice_ce_loss_weight: 1.0
  ranking_loss_weight: 0.1
  ranking_loss_margin: 0.1
  ranking_loss_negative: shuffled
  prompt_template: task_specific
  max_prompt_tokens: 512
  max_target_tokens: 8
  append_eos: true
  # Keep per-epoch evaluation cheap; run the full baseline set once on the final best checkpoint.
  eval_baselines:
    - correct
    - shuffled
  final_eval_baselines:
    - correct
    - global_only
    - local_only
    - no_latent
    - zero_latent
    - shuffled
    - shuffled_stats
  choice_score: mean
  # Pair different natural-language questions for the same tensor and operation inside each batch.
  group_questions_by_state: true
  questions_per_state_group: 2
  # Prevent the easy quadrant task from dominating checkpoint selection.
  checkpoint_metric: macro_latent_gain
  log_interval: 20
  # W&B retains step curves; the terminal and metrics JSON stay compact by default.
  console_progress: false
  save_step_metrics: false
  diagnostics:
    enabled: true
    every_epochs: 1
    records_per_task: 4
    layers: [0, 2, 8, 14, -1]

wandb:
  enabled: true
  api_key: null
  project: tensor-compression
  entity: null
  group: adapter
  tags:
    - adapter
    - tensor-llm
    - soft-prompt
    - patch-alignment
  mode: online
  log_model: false

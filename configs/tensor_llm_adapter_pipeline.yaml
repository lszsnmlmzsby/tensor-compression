# Template for the tensor-latent -> soft-prompt -> frozen-LLM pipeline.
# Copy this file to configs/local_tensor_llm_adapter_pipeline.yaml on the server
# and fill in machine-specific paths there. configs/local_*.yaml is gitignored.

storage:
  candidate_roots:
    - /data
    - /scratch
    - /mnt
    - /home
  min_free_gb: 100
  asset_root: /data/wyx/tensor_llm_assets
  hf_home: /data/wyx/hf_cache
  output_root: /data/wyx/tensor_llm_outputs

runtime:
  seed: 42
  device: auto

data:
  hdf5_path: /data/PiERN/PDEbench/data/2d-ns/2D_CFD_Turb_M0.1_Eta1e-08_Zeta1e-08_periodic_512_Train.hdf5
  fields:
    - Vx
  qa_dir: /data/wyx/tensor_llm_assets/tensor_readout_qa_vx
  latent_dir: /data/wyx/tensor_llm_assets/tensor_readout_latents_vx_2x

compressor:
  config: null
  checkpoint: /home/lpr/wyx/tensor-compression/outputs/runs/20260620_153406_compressor_2d_baseline/checkpoints/best.pt

model:
  name_or_path: Qwen/Qwen2.5-1.5B-Instruct
  local_dir: null
  revision: main
  trust_remote_code: false
  torch_dtype: bfloat16
  allow_patterns:
    - "*.json"
    - "*.safetensors"
    - "*.txt"
    - "*.model"
    - "*.py"
    - "tokenizer.*"
  ignore_patterns:
    - "*.h5"
    - "*.onnx"
    - "*.msgpack"

qa_generation:
  sample_indices: all
  time_indices: all
  max_states: 21000
  train_ratio: 0.7
  val_ratio: 0.15
  test_ratio: 0.15
  spatial_stride: 1
  num_bins: 10
  quantile_samples_per_state: 4096
  patch_size: 32
  point_bin_per_state: 15
  point_compare_per_state: 10
  patch_compare_per_state: 10
  max_quadrant_per_state: 0
  global_stat_bin_per_state: 0
  compare_min_bin_distance: 1
  compare_max_attempts: 32
  include_oracle: true

latent_export:
  splits:
    - train
    - val
    - test
  batch_size: 4
  device: auto
  spatial_stride: 1
  storage_dtype: float16
  allow_field_mismatch: false
  overwrite: false

patch_alignment:
  # Tensor-as-text alignment pretraining. The same PDEBench patch goes through:
  #   tensor path: patch -> patch AE encoder -> Q-Former soft prompt -> frozen LLM hidden state
  #   text path: serialized patch -> frozen LLM middle hidden state -> vector
  # and the two vectors are trained with contrastive/cosine losses.
  enabled: false  # Reserved for future pipeline orchestration; ignored when this script is called directly.
  run_name: tensor_patch_text_alignment_vx
  output_root: /data/wyx/tensor_llm_outputs/runs
  hdf5_path: /data/PiERN/PDEbench/data/2d-ns/2D_CFD_Turb_M0.1_Eta1e-08_Zeta1e-08_periodic_512_Train.hdf5
  fields:
    - Vx
  patch_size: 16
  # Number of random sample/time/patch records created in-memory per split.
  train_records: 65536
  val_records: 4096
  test_records: 4096
  sample_indices: all
  time_indices: all
  seed: 42
  device: auto
  batch_size: 16
  eval_batch_size: 16
  epochs: 40
  lr: 1.0e-4
  weight_decay: 1.0e-4
  grad_clip_norm: 1.0
  num_workers: 0
  # patch_ae_config: build a patch-sized AE from patch_encoder below.
  # checkpoint: load compressor_checkpoint; use this for a trained patch AE or legacy 512x512 AE.
  encoder_source: patch_ae_config
  # true: update AE encoder during alignment. For a fresh patch AE this should stay true.
  # false: freeze a loaded checkpoint encoder and train only the alignment adapter.
  # To reuse a trained patch AE, set:
  #   encoder_source: checkpoint
  #   compressor_checkpoint: /path/to/alignment_best.pt or patch_ae_pretrain_last.pt
  #   train_patch_ae: false
  #   patch_ae_pretrain_epochs: 0
  train_patch_ae: true
  # true: after reconstruction pretraining, freeze patch AE and train only the Q-Former/soft prompt bridge.
  freeze_patch_ae_after_pretrain: true
  # Reconstruction-only warmup for a fresh patch AE before contrastive alignment starts.
  patch_ae_pretrain_epochs: 5
  # Used only when encoder_source: checkpoint.
  compressor_checkpoint: null
  compressor_config: null
  # With patch_ae_config this should be false. Set true only when loading a checkpoint whose input_size
  # differs from patch_size, for example the legacy 512x512 compressor.
  resize_patch_to_compressor_input: false
  patch_encoder:
    normalization:
      mode: zscore
      scope: channel
      stats_path: null
      clip_min: null
      clip_max: null
    model:
      name: conv_token_autoencoder_2d
      input_size: [16, 16]
      base_channels: 32
      channel_multipliers: [1, 2]
      num_res_blocks: 1
      latent_dim: 128
      latent_grid: [4, 4]
      dropout: 0.0
      norm: group
      activation: gelu
      output_activation: identity
  adapter_type: qformer
  adapter_dim: 512
  query_tokens: 8
  adapter_layers: 2
  adapter_heads: 8
  # null means directly align to the LLM hidden size. This keeps the text teacher side fixed.
  projection_dim: null
  dropout: 0.0
  # Bound each soft prompt dimension with tanh before feeding it to the frozen LLM.
  # 0 disables the bound; 0.05 keeps token norms near ordinary input embeddings.
  soft_prompt_scale: 0.05
  temperature: 0.07
  contrastive_loss_weight: 1.0
  # Keep this at 0 for now: raw cosine can reward shared hidden-space directions without improving retrieval.
  cosine_loss_weight: 0.0
  # Only contributes gradients when train_patch_ae is true; otherwise it is logged as a metric.
  reconstruction_loss_weight: 1.0
  # normalized: serialize exactly the normalized/resized patch that enters the AE.
  # raw: serialize the original HDF5 values; useful only as an ablation.
  teacher_text_source: normalized
  # Subtract batch means before L2 normalization and InfoNCE to reduce common hidden-space directions.
  center_embeddings: true
  # true: fail immediately if tokenization/truncation drops the Representation anchor.
  fail_on_text_anchor_missing: true
  # true: fail when a serialized text sequence reaches max_text_tokens, because truncation is then ambiguous.
  fail_on_text_max_length_hit: true
  # compact excludes sample/time/top_left metadata because tensor path cannot observe them.
  # compact_with_metadata keeps the previous metadata-rich prompt only for ablation.
  text_prompt_template: compact
  text_decimal_places: 3
  max_text_tokens: 1024
  # Number of training records checked before AE warmup to catch teacher text truncation early.
  text_preflight_records: 32
  # Qwen2.5-1.5B has 28 decoder layers; lower-middle layers are usually easier for input-level soft prompts.
  teacher_layer: 8
  log_interval: 20

adapter:
  soft_prompt_tokens: 32
  adapter_dim: 512
  adapter_layers: 2
  adapter_heads: 8
  dropout: 0.1
  latent_pos_encoding: grid
  question_conditioning: true
  question_condition_gate_init: 1.0
  structured_query_conditioning: true
  soft_prompt_scale: 0.05

llm_training:
  run_name: tensor_llm_adapter_vx_2x_qwen25_1p5b
  output_root: /data/wyx/tensor_llm_outputs/runs
  train_split: train
  val_split: val
  test_split: test
  max_train_records: null
  max_val_records: null
  max_test_records: null
  prefer_record_latent_ref: false
  device: auto
  torch_dtype: bfloat16
  shuffle_seed: 42
  epochs: 3
  batch_size: 2
  eval_batch_size: 2
  eval_choice_batch_size: 16
  gradient_accumulation_steps: 1
  lr: 1.0e-4
  weight_decay: 1.0e-2
  grad_clip_norm: 1.0
  ce_loss_weight: 0.1
  choice_ce_loss_weight: 1.0
  ranking_loss_weight: 0.5
  ranking_loss_margin: 0.1
  ranking_loss_negative: shuffled
  prompt_template: task_specific
  max_prompt_tokens: 512
  max_target_tokens: 8
  append_eos: true
  eval_baselines:
    - correct
    - no_latent
    - zero_latent
    - shuffled
  choice_score: mean
  log_interval: 20

wandb:
  enabled: true
  api_key: null
  project: tensor-compression
  entity: null
  group: adapter
  tags:
    - adapter
    - tensor-llm
    - soft-prompt
    - patch-alignment
  mode: online
  log_model: false

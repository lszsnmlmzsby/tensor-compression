# Mixed-field v2: 50% PDEBench, 25% correlated, 25% IID; 32 training shapes.
# One token per cell, absolute row/column 2D positions, no spatial padding.
storage:
  hf_home: ${FIELD_TO_LLM_ROOT}/hf_cache
  output_root: ${FIELD_TO_LLM_ROOT}/tensor_llm_outputs/runs
model:
  name_or_path: Qwen/Qwen2.5-14B-Instruct
  local_dir: null
  torch_dtype: bfloat16
  trust_remote_code: false
  gradient_checkpointing: true
data:
  shape_mode: variable
  qa_protocol: mixed_shape_field_qa_v2
  input_source: raw_hdf5
  hdf5_path: ${PDEBENCH_HDF5}
  patch_size: 16  # Initialization reference only; runtime H,W come from each record.
  raw_normalized_dtype: float16
  real_fields: [Vx, Vy, density, pressure]
  fields: [Vx, Vy, density, pressure, scalar]
  train_shapes: [8x8, 8x16, 16x8, 16x16, 16x32, 32x16, 32x32,
    12x20, 20x12, 24x24, 8x32, 32x8, 9x17, 17x9, 15x31, 31x15,
    23x25, 25x23, 8x64, 64x8, 16x64, 64x16, 15x88, 88x15,
    19x80, 80x19, 16x96, 96x16, 21x95, 95x21, 32x64, 64x32]
  heldout_shapes: [17x90, 90x17, 13x47, 47x13, 29x43, 43x29, 40x40, 33x55]
  # Length extrapolation first; unseen coordinate range second.
  extrapolation_shapes: [48x48, 64x64, 16x128, 128x16]
  require_disjoint_splits: true
  input_cache_size: 4096
  num_workers: 2
generation:
  seed: 20260906
  split_seed: 20260905  # Keep PDEBench trajectory assignments identical to v1.
  point_compare_min_gap: 0.1
  region_size: 4
  numeric_min_gap: 0.5
  region_min_gap: 0.2
  decimal_places: 6
  max_attempts_per_state: 100
field_encoder:
  trainable: true
  normalization:
    mode: zscore
    scope: channel
    stats_path: null
    clip_min: null
    clip_max: null
  model:
    name: conv_token_autoencoder_2d
    input_size: [16, 16]
    base_channels: 32
    channel_multipliers: []
    num_res_blocks: 1
    latent_dim: 8
    latent_grid: [16, 16]
    preserve_input_channels: true
    dropout: 0.0
    norm: group
    activation: gelu
    output_activation: identity
spatial_adapter:
  type: full_grid_transformer
  adapter_dim: 512
  adapter_layers: 2
  adapter_heads: 8
  dropout: 0.0
memory:
  init_mode: scratch
  freeze_spatial_backbone: false
  latent_channel_policy: all
  value_fourier_bands: 4
  value_hidden_dim: 128
cross_attention:
  layers_1based: [8, 20, 32]
  bridge_dim: 512
  heads: 8
  dropout: 0.0
  gate_init: 0.0
training:
  batch_size: 3
  gradient_accumulation_steps: 1
  questions_per_state_group: 3
  lr: 5.0e-5
  gate_lr: 5.0e-4
  lr_scheduler: cosine
  warmup_ratio: 0.03
  min_lr_ratio: 0.2
  weight_decay: 1.0e-4
  grad_clip_norm: 1.0
  choice_ce_weight: 1.0
  full_answer_ce_weight: 0.02
  matched_group_weight: 0.1
  matched_group_margin: 0.5
  value_reconstruction_weight: 0.01
  prompt_template: field_memory
  max_prompt_tokens: 512
  max_target_tokens: 8
  append_eos: true
  log_interval: 20
evaluation:
  batch_size: 1  # Includes 64x64 = 4096-cell memory during final evaluation.
  screening_fractions: [0.125, 0.25, 0.5, 0.75, 1.0]
  selection_metric: macro_accuracy
  final_modes: [correct]
  export_predictions: true
  evaluate_test: false
runtime:
  seed: 42
  shuffle_seed: 42
  device: auto
  distributed_timeout_seconds: 7200
  serialize_llm_loading: true
  low_cpu_mem_usage: true
  min_host_memory_available_gib: 16
  save_every_updates: 1000
  console_progress: true
profiles:
  pilot:
    data:
      qa_dir: ${FIELD_TO_LLM_ROOT}/data/variable_shape_mixed_v2_qa/pilot
    generation:
      train_states: 2048
      eval_states_per_shape: 16
    training:
      run_name: variable_shape_mixed_v2_pilot
      epochs: 2
      max_updates: 3000
    evaluation:
      screening_records: 1280
    runtime:
      max_wall_clock_hours: 6
      final_eval_reserve_minutes: 60
  full:
    data:
      qa_dir: ${FIELD_TO_LLM_ROOT}/data/variable_shape_mixed_v2_qa/full
    generation:
      train_states: 65536
      eval_states_per_shape: 256
    training:
      run_name: variable_shape_mixed_v2_full
      epochs: 2
      max_updates: 131072
    evaluation:
      screening_records: 5120
    runtime:
      max_wall_clock_hours: 48
      final_eval_reserve_minutes: 180

# Paper configuration for the Direct-QA prefix warm start used to initialize
# the final cross-attention memory. This is not the final inference interface.
# Required: FIELD_TO_LLM_ROOT and FIELD_TO_LLM_ALIGNMENT_CHECKPOINT.

storage:
  hf_home: ${FIELD_TO_LLM_ROOT}/hf_cache
  output_root: ${FIELD_TO_LLM_ROOT}/runs

runtime:
  seed: 42
  device: auto

model:
  name_or_path: Qwen/Qwen2.5-14B-Instruct
  local_dir: null
  torch_dtype: bfloat16
  trust_remote_code: false

patch_qa:
  alignment_checkpoint: ${FIELD_TO_LLM_ALIGNMENT_CHECKPOINT}
  qa_dir: ${FIELD_TO_LLM_ROOT}/data/patch_qa
  latent_dir: ${FIELD_TO_LLM_ROOT}/data/patch_latents

adapter:
  architecture: alignment_adapter
  init_checkpoint: ${FIELD_TO_LLM_ALIGNMENT_CHECKPOINT}
  soft_prompt_tokens: 256
  adapter_dim: 512
  adapter_layers: 2
  adapter_heads: 8
  dropout: 0.0
  latent_pos_encoding: grid
  question_conditioning: false
  question_condition_gate_init: 0.0
  structured_query_conditioning: false
  soft_prompt_scale: 0.05

llm_training:
  run_name: field_to_llm_direct_qa_warm_start
  output_root: ${FIELD_TO_LLM_ROOT}/runs
  train_split: train
  val_split: val
  test_split: test
  max_train_records: 138240
  max_val_records: 1020
  max_test_records: 1020
  initial_eval_records: 500
  record_subset_mode: prefix
  require_disjoint_splits: true
  require_untruncated_prompts: true
  prefer_record_latent_ref: false
  latent_cache_size: 8192
  latent_channel_policy: all
  num_workers: 0
  distributed_timeout_seconds: 7200
  serialize_llm_loading: true
  low_cpu_mem_usage: true
  min_host_memory_available_gib: 16
  device: auto
  torch_dtype: bfloat16
  shuffle_seed: 42
  epochs: 1
  batch_size: 3
  eval_batch_size: 8
  eval_choice_batch_size: 4
  train_choice_batch_size: 12
  train_grounding_batch_size: 8
  gradient_accumulation_steps: 1
  llm_gradient_checkpointing: true
  lr: 2.0e-5
  lr_scheduler: cosine
  warmup_ratio: 0.03
  min_lr_ratio: 0.1
  weight_decay: 1.0e-4
  grad_clip_norm: 1.0
  ce_loss_weight: 0.05
  choice_ce_loss_weight: 1.0
  ranking_loss_weight: 0.1
  ranking_loss_margin: 0.1
  ranking_loss_negative: no_latent
  swapped_question_loss_weight: 0.0
  swapped_question_loss_margin: 0.1
  matched_group_loss_weight: 0.0
  matched_group_loss_margin: 0.5
  group_questions_by_state: true
  questions_per_state_group: 3
  prompt_template: task_specific
  max_prompt_tokens: 512
  max_target_tokens: 8
  append_eos: true
  eval_baselines: [correct, shuffled]
  final_eval_baselines: [correct, no_latent, zero_latent, shuffled, shuffled_stats]
  choice_score: mean
  choice_scoring_mode: auto
  checkpoint_metric: macro_latent_gain
  checkpoint_updates: ""
  checkpoint_fractions: ""
  log_interval: 20
  console_progress: true
  save_step_metrics: false
  evaluate_test: true
  diagnostics:
    enabled: true
    every_epochs: 1
    records_per_task: 4
    save_states: false
    generation_max_new_tokens: 8
    layers: [0, 2, 8, 14, -1]

wandb:
  enabled: false
  project: field-to-llm
  group: direct-qa
  mode: offline
  log_model: false
  detailed_metrics: false

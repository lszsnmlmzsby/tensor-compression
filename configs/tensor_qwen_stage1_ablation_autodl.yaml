# Isolated ablation of Stage-1 tensor/text alignment pretraining.
# Neither production trainer nor either production config consumes this file.
#
# Experimental control:
#   changed   = learned Stage-1 spatial-adapter initialization only
#   preserved = latent/field encoder, architecture, data, Qwen, Direct-QA recipe,
#               and dense cross-attention recipe

ablation:
  seed: 42
  source_stage1_checkpoint: /data/wyx/tensor_llm_outputs/runs/20260722_160923_tensor_patch_text_alignment_qwen25_14b_spatial256_stage2_final/alignment_best.pt

direct:
  base_config: configs/tensor_llm_adapter_pipeline_autodl.yaml
  # These options reconstruct the completed Direct-QA initializer run. They are
  # passed through the production parser, so its current validation remains active.
  arg_overrides:
    qa_dir: /data/wyx/tensor_llm_assets/tensor_patch_qa_16_spatial256_14b_v3_direct
    latent_dir: /data/wyx/tensor_llm_assets/tensor_patch_latents_16_spatial256_14b_v3_direct
    qa_alignment_checkpoint: /data/wyx/tensor_llm_outputs/runs/20260722_160923_tensor_patch_text_alignment_qwen25_14b_spatial256_stage2_final/alignment_best.pt
    adapter_init_checkpoint: /data/wyx/tensor_llm_outputs/runs/20260722_160923_tensor_patch_text_alignment_qwen25_14b_spatial256_stage2_final/alignment_best.pt
    adapter_architecture: alignment_adapter
    stage2_warm_start_checkpoint: none
    stage2b_resume_checkpoint: none
    joint_ab_training: false
    point_reader_training: false
    full_local_reader_training: false
    grounding_routing_warmup_epochs: 0
    run_name: tensor_stage1_ablation_direct_qa_autodl
    max_train_records: 138240
    max_val_records: 1020
    max_test_records: 1020
    initial_eval_records: 500
    record_subset_mode: prefix
    epochs: 1
    batch_size: 3
    eval_batch_size: 8
    eval_choice_batch_size: 4
    train_choice_batch_size: 12
    train_grounding_batch_size: 8
    gradient_accumulation_steps: 1
    num_workers: 0
    lr: 2.0e-5
    lr_scheduler: cosine
    warmup_ratio: 0.03
    min_lr_ratio: 0.1
    weight_decay: 1.0e-4
    grad_clip_norm: 1.0
    ce_loss_weight: 0.05
    choice_ce_loss_weight: 1.0
    ranking_loss_weight: 0.1
    ranking_loss_margin: 0.1
    ranking_loss_negative: no_latent
    swapped_question_loss_weight: 0.0
    matched_group_loss_weight: 0.0
    grounding_routing_loss_weight: 0.0
    grounding_joint_routing_loss_weight: 0.0
    grounding_gate_loss_weight: 0.0
    local_soft_prompt_tokens: 256
    local_adapter_layers: 2
    local_fusion_mode: residual_spatial_transformer
    global_lr: 1.0e-5
    group_questions_by_state: true
    questions_per_state_group: 3
    eval_baselines: [correct, shuffled]
    final_eval_baselines: [correct, no_latent, zero_latent, shuffled, shuffled_stats]
    choice_scoring_mode: auto
    checkpoint_metric: macro_latent_gain
    checkpoint_updates: ""
    checkpoint_fractions: ""
    save_step_metrics: false
    evaluate_test: true
    diagnostics_enabled: true
    diagnostics_save_states: false
    console_progress: true

dense:
  # Architecture, data, loss, optimizer, screening, and wall-clock settings are
  # inherited unchanged. The CLI supplies the ablated Direct-QA checkpoint.
  base_config: configs/tensor_qwen_cross_attention_8h_autodl.yaml
